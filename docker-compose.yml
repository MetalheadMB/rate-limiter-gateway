# Brings up: one Redis, two instances of the app, and an nginx gateway that
# round-robins between them -- everything needed to see the shared rate
# limit working for real, not simulated.
#
#   docker compose up --build
#
# Then hit the SINGLE entrypoint (nginx), not the app instances directly, so
# your requests actually get load-balanced between app1 and app2:
#
#   curl -i http://localhost:8080/api/data
#
# Watch the X-Served-By header alternate between app1 and app2, and
# X-RateLimit-Remaining count down continuously across both -- that's the
# thing an in-memory Map cannot do, because each instance would otherwise
# have its own separate counter.
#
# app1 and app2 are deliberately NOT published to the host: nginx is the only
# way in. That's what makes TRUST_PROXY=1 safe -- the apps trust the
# X-Forwarded-For header, and only nginx can set it. If an app port were
# published, a client could hit it directly with a fake X-Forwarded-For and
# get a fresh rate-limit bucket on every request.
#
# See scripts/verify-redis-limiter.js for an automated version of this proof.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app1:
    build: .
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: app1
      TRUST_PROXY: 1 # read the client IP nginx sets; safe only because this port isn't published
    depends_on:
      redis:
        condition: service_healthy

  app2:
    build: .
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: app2
      TRUST_PROXY: 1
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
