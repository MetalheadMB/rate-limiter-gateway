# Round-robins across both app instances so a single client (you, curling
# localhost:8080) gets load-balanced requests exactly like a real deployment
# would -- this is what makes "one client, two instances" an honest test
# instead of a simulation: nginx decides which instance handles each
# request, not the test script.

events {}

http {
  upstream gateway_backend {
    server app1:3000;
    server app2:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://gateway_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Express's `trust proxy` setting (src/server.js) reads this to
      # recover the real client IP -- without it, every request would look
      # like it came from nginx itself, and the per-IP limit would be
      # meaningless.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
